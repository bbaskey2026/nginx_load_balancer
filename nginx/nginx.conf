worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Pure reverse proxy: Node sets Content-Type, so mime.types is not needed
    default_type application/octet-stream;

    # Pool of Node.js instances
    upstream node_backend {
        # Strategy: round-robin by default.
        # Uncomment one to change: least_conn;  or  ip_hash;
        least_conn;

        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;

        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://node_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Retry on another instance if one is down
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;

            add_header X-Upstream $upstream_addr always;
        }
    }
}